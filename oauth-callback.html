<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" /><meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Boas descobertas para a vida estudantil. Explore o primeiro protótipo da Alba, um hub de benefícios digitais para estudantes." />
    <meta name="theme-color" content="#F7F2E9" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/assets/brand-loader.css" />
    <link rel="preload" href="/assets/sol-e-livro-logo.png" as="image" />
    <link rel="icon" type="image/x-icon" href="/favicon-sol-e-livro.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-sol-e-livro.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=sol-livro-2" />
    <link rel="preload" href="/assets/fonts/fraunces-variable.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/assets/fonts/dm-sans-variable.ttf" as="font" type="font/ttf" crossorigin />
    <title>Seu acesso — Alba</title>
  </head>
  <body>
    <div id="root">
      <main class="brand-loader" aria-label="Carregando a Alba" aria-busy="true">
        <div class="brand-loader-content">
          <div class="brand-loader-mark" aria-hidden="true">
            <img src="/assets/sol-e-livro-logo.png" width="512" height="288" alt="" fetchpriority="high" />
          </div>
          <p class="brand-loader-name" aria-hidden="true">Alba</p>
          <p class="brand-loader-message" role="status" aria-live="polite">Preparando boas descobertas…</p>
          <span class="brand-loader-line" aria-hidden="true"></span>
        </div>
      </main>
    </div>
    <noscript>
      <style>.brand-loader { display: none; }</style>
      <p>A Alba precisa de JavaScript para abrir o catálogo. Ative-o no navegador e recarregue a página.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
