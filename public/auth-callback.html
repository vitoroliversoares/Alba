<body><div class="info-wrap">
  <header class="info-header"><a class="info-brand" href="/">Alba</a><a href="/#catalogo">Explorar benefícios →</a></header>
  <main><p class="info-kicker">Sua conta</p><h1 id="callback-title">Vamos conferir seu acesso.</h1>
    <p id="callback-status" class="info-intro" role="status" aria-live="polite">Verificando o link…</p>

      <label for="new-password">Nova senha</label><input id="new-password" name="password" type="password" autoComplete="new-password" minLength="8" maxLength="128" required />
      <label for="confirm-password">Confirme a nova senha</label><input id="confirm-password" name="confirmPassword" type="password" autoComplete="new-password" minLength="8" maxLength="128" required />
      <button type="submit" class="info-action">Salvar nova senha</button>
    </form>
    <p><a href="/">Voltar à Alba e entrar</a></p>
    <noscript><p>Ative JavaScript para concluir a verificação deste link. Se ele expirou, solicite novas instruções na Alba.</p></noscript>
  </main>
  <footer class="info-footer"><span>Alba · Boas descobertas para a vida estudantil.</span><nav aria-label="Links institucionais"><a href="/quem-somos.html">Quem somos</a><a href="/privacidade.html">Privacidade e LGPD</a></nav></footer>
